[project]
name = "langsmith-evals"
version = "0.1.0"
description = "LangChain + LangSmith eval scripts (offline, online, pairwise) across OpenAI, Ollama, and Hugging Face"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.6",
    "langsmith>=0.14.0",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langsmith_evals"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
